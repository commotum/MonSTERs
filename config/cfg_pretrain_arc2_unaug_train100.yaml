# Reduced ARC-2 ablation config: original data only, no augmentation, smaller train set.

defaults:
  - arch: hrm_v1
  - _self_

hydra:
  output_subdir: null

data_path: data/arc-2-unaug-train100

global_batch_size: 96

epochs: 20000
eval_interval: 500
checkpoint_every_eval: true
eval: true
checkpoint_interval: null
resume: auto
allow_degraded: true
deterministic_resume: true

lr: 1e-4
lr_min_ratio: 1.0
lr_warmup_steps: 2000

beta1: 0.9
beta2: 0.95
weight_decay: 1.0
puzzle_emb_weight_decay: 1.0

puzzle_emb_lr: 1e-2

project_name: arc2-unaug-train100-ablation
